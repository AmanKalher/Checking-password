<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Simulator</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding: 50px; }
        .box { background-color: #1e1e1e; max-width: 400px; margin: 0 auto; padding: 30px; border-radius: 8px; border: 1px solid #333; }
        input { width: 80%; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #555; text-align: center; }
        button { background-color: #007ACC; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        #result { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🔐 Password Simulator</h2>
        <p>Enter numeric code:</p>
        <input type="password" id="passwordInput" placeholder="12345">
        <br>
        <button onclick="sendPassword()">Crack Password</button>
        <div id="result"></div>
    </div>

    <script>
    function sendPassword() {
        let password = document.getElementById("passwordInput").value;
        let resultDiv = document.getElementById("result");
        if (!password) {
            resultDiv.innerHTML = "<span style='color: red;'>Type a password!</span>";
            return;
        }
        resultDiv.innerHTML = "<span style='color: orange;'>Processing...</span>";

        const BACKEND_URL = window.location.origin + "/crack"; 

        fetch(BACKEND_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: password })
        })
        .then(res => res.json())
        .then(data => {
            resultDiv.innerHTML = `<span style='color: green;'>Cracked!</span><br>Found: ${data.guessed_password}<br>Attempts: ${data.attempts}`;
        })
        .catch(err => {
            resultDiv.innerHTML = "<span style='color: red;'>Error connecting.</span>";
        });
    }
    </script>
</body>
</html>
