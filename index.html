<script>
function sendPassword() {
    let password = document.getElementById("passwordInput").value;
    let resultDiv = document.getElementById("result");

    if (!password) {
        resultDiv.innerHTML = "<span style='color: #ff4d4d;'>Please enter a password!</span>";
        return;
    }

    resultDiv.innerHTML = "<span style='color: #ffcc00;'>Cracking... please wait...</span>";

    // Dynamic routing: automatically uses the correct host domain name
    const BACKEND_URL = window.location.origin + "/crack"; 

    fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: password })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Server returned error status');
        }
        return response.json();
    })
    .then(data => {
        if (data.error) {
            resultDiv.innerHTML = `<span style='color: #ff4d4d;'>Error: ${data.error}</span>`;
            return;
        }
        resultDiv.innerHTML = `
            <span style='color: #00ff00;'>Target Cracked!</span><br><br>
            Found: ${data.guessed_password}<br>
            Attempts: ${data.attempts}<br>
            Time taken: ${data.time_taken}s
        `;
    })
    .catch(error => {
        console.error("Fetch Error:", error);
        resultDiv.innerHTML = "<span style='color: #ff4d4d;'>Connection dropped. Please try again in a few seconds!</span>";
    });
}
</script>
